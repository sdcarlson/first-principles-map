<title>Project retired</title>
<style>
  :root { --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --link: #0969da; }

  html, body { margin: 0; height: 100%; }

    background: var(--bg); color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  }

  h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 .5rem; }

  <p>Redirecting to <a href="https://github.com/sdcarlson">github.com/sdcarlson</a>.</p>
